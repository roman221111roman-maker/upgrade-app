<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upgrade</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--y:#f5c518;--bg:#07070b;--card:#13131b;--line:#262634;--tx:#f1f1f5;--mut:#8a8a9c;--ok:#34d399;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(60% 40% at 15% 12%,rgba(150,70,20,.40),transparent 70%),
 radial-gradient(55% 40% at 88% 20%,rgba(70,40,150,.35),transparent 70%),
 radial-gradient(50% 35% at 50% 38%,rgba(245,197,24,.12),transparent 70%),
 repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 2px,transparent 2px 9px),
 linear-gradient(#0d0d14,#050508)}
.wrap{max-width:520px;margin:0 auto;padding:8px 10px 24px}
.nav{display:flex;align-items:center;gap:8px;padding:6px 0}
.tabs{display:flex;gap:6px;flex:1}.tabs span{padding:6px 10px;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:11px;letter-spacing:.5px;background:#0c0c12}
.tabs .on{color:var(--y);border-color:var(--y)}
.bal{background:#0c0c12;border:1px solid var(--y);color:var(--y);padding:6px 10px;border-radius:6px;font-weight:700}
.snd{background:#0c0c12;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 8px;cursor:pointer}
.ring{position:relative;width:250px;height:250px;margin:10px auto 4px;filter:drop-shadow(0 0 22px rgba(245,197,24,.25))}
.ring svg{width:100%;height:100%}.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.rc b{font-size:38px;font-weight:800;letter-spacing:-1px}.rc span{color:var(--mut);font-size:11px;letter-spacing:2px}
.cards{display:flex;gap:10px;margin:8px 0}
.card{flex:1;min-height:132px;border-radius:10px;padding:8px;text-align:center;background:rgba(19,19,27,.85);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card.l{border-color:#7c3aed;box-shadow:inset 0 -18px 28px -22px #7c3aed}.card.r{border-color:#3b82f6;box-shadow:inset 0 -18px 28px -22px #3b82f6}
.card img{width:100%;max-width:130px;height:62px;object-fit:contain}.card .em{font-size:36px;height:62px;line-height:62px;opacity:.5}
.card small{color:var(--mut);font-size:10px}.card b{font-size:12px}.card .pr{color:var(--y);font-size:15px;font-weight:800}
.quick{display:flex;gap:6px;justify-content:center;margin:6px 0}.quick button{background:#0c0c12;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.quick button.on{background:var(--y);color:#111;border-color:var(--y)}
.go{width:100%;padding:13px;border:0;border-radius:8px;background:linear-gradient(#ffd93d,#e0aa00);color:#1a1400;font-weight:900;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 0 18px rgba(245,197,24,.3)}
.go:disabled{opacity:.35;box-shadow:none}
.case{display:none;width:100%;margin-top:8px;padding:10px;border:1px solid #f59e0b;border-radius:8px;background:#1c1405;color:#fbbf24;font-weight:700;cursor:pointer}
.res{text-align:center;min-height:18px;margin-top:6px;font-weight:700}
details{margin-top:10px;background:rgba(19,19,27,.8);border:1px solid var(--line);border-radius:8px;padding:8px}summary{cursor:pointer;color:var(--mut)}
details label{display:block;color:var(--mut);margin:10px 0 3px}details input[type=range]{width:100%;accent-color:var(--y)}
pre{margin:8px 0 0;white-space:pre-wrap;font:11px/1.4 ui-monospace,monospace;color:var(--mut)}
.add{display:flex;gap:6px;margin-top:8px}.add input,.add select{background:#0c0c12;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;min-width:0}.add input{flex:1}.add button{background:#0c0c12;color:var(--tx);border:1px solid var(--y);border-radius:6px;padding:7px 10px;cursor:pointer}
.gtabs{display:flex;gap:6px;margin:14px 0 8px}.gtabs button{flex:1;padding:8px;background:#0c0c12;color:var(--mut);border:1px solid var(--line);border-radius:6px;font-weight:700;cursor:pointer}.gtabs .on{background:var(--y);color:#111;border-color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gc{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--rc);border-radius:7px;padding:5px 4px 4px;text-align:center;cursor:pointer;font-size:10px;min-height:92px}
.gc.sel{outline:2px solid var(--y)}.gc.dim{opacity:.4}.gc img{width:100%;height:42px;object-fit:contain}.gc .em{font-size:26px;height:42px;line-height:42px;opacity:.6}
.gc .ch{position:absolute;top:3px;left:5px;color:var(--ok);font-weight:800;font-size:10px}.gc .nm{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc .p{color:var(--tx);font-weight:800}
.gc .sell{display:block;width:100%;margin-top:3px;background:var(--y);color:#111;border:0;border-radius:4px;font-weight:800;font-size:10px;padding:3px;cursor:pointer}
.note{color:var(--mut);font-size:10px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}.mbox{width:100%;max-width:300px;background:#12121a;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.mh{padding:12px;font-size:22px;font-weight:900;letter-spacing:2px}.mh.w{background:#1d5a1d}.mh.l{background:#6b1414}
.mb{padding:14px}.mb small{color:var(--mut)}.mb img{display:block;width:100%;max-width:180px;height:80px;object-fit:contain;margin:8px auto}.mb .em{font-size:44px;height:80px;line-height:80px;opacity:.5}
.mb .mn{font-weight:700}.mb .mp{color:var(--y);font-size:20px;font-weight:900;margin:2px 0 12px}
.mbtns{display:flex;gap:8px}.mbtns button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c0c12;color:var(--tx);font-weight:700;cursor:pointer}.mbtns .y{background:var(--y);color:#111;border-color:var(--y)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="nav">
    <div class="tabs"><span>CONTRACT</span><span class="on">UPGRADE</span><span>BATTLES</span></div>
    <div class="bal"><b id="bal">0</b> C</div><button class="snd" id="snd">🔊</button>
  </div>

  <div class="ring">
    <svg viewBox="0 0 260 260">
      <defs><radialGradient id="rg"><stop offset="0" stop-color="#14141c"/><stop offset="1" stop-color="#08080c"/></radialGradient></defs>
      <circle cx="130" cy="130" r="104" fill="url(#rg)"/>
      <circle cx="130" cy="130" r="112" fill="none" stroke="#2a2a33" stroke-width="16"/>
      <circle id="win" cx="130" cy="130" r="112" fill="none" stroke="#f5c518" stroke-width="16" transform="rotate(-90 130 130)"/>
      <g id="ptr" style="transform-origin:130px 130px"><polygon points="130,0 120,16 140,16" fill="#fff" stroke="#f5c518" stroke-width="2"/></g>
    </svg>
    <div class="rc"><b id="pct">—</b><span>ШАНС</span></div>
  </div>

  <div class="cards">
    <div class="card l" id="myC"></div>
    <div class="card r" id="tgC"></div>
  </div>

  <div class="quick" id="quick">
    <button data-c="25">25%</button><button data-c="50">50%</button><button data-c="75">75%</button>
    <button data-m="2">x2</button><button data-m="3">x3</button><button data-m="5">x5</button>
  </div>
  <button class="go" id="go" disabled>UPGRADE ➜</button>
  <div class="res" id="res"></div>
  <button class="case" id="caseBtn"></button>

  <details>
    <summary>⚙ Параметри та математика</summary>
    <label>Шанс вручну: <b id="chLbl">75</b>%</label>
    <input id="chance" type="range" min="1" max="95" value="75">
    <label>Комісія (house edge, відкрита): <b id="edgeLbl">0</b>%</label>
    <input id="edge" type="range" min="0" max="10" value="0">
    <pre id="math">Обери свій предмет</pre>
    <div class="add"><input id="amt" type="number" min="1" value="40" inputmode="numeric"><select id="cur"><option value="2">₴ грн</option><option value="1">₽ руб</option><option value="0">коїни</option></select><button id="add">+ демо-предмет</button></div>
    <div class="note">1 ₴ = 2 коїни · 1 ₽ = 1 коїн. ✦ = скін з AI-картинки, назва і ціна умовні.</div>
  </details>

  <div class="gtabs"><button id="tMy" class="on">Мої скіни</button><button id="tShop">Магазин (ціль)</button></div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="mh" id="mh"></div>
  <div class="mb"><small id="mSub"></small><div id="mImg"></div><div class="mn" id="mName"></div><div class="mp" id="mPrice"></div>
    <div class="mbtns"><button id="mCont">Продовжити</button><button class="y" id="mSell">Продати</button></div>
    <button class="case" id="mCase" style="margin-top:10px"></button></div>
</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#07070b'); tg.setBackgroundColor('#07070b'); } catch (e) {} }

  const P = {
    rifle:'<rect x="6" y="40" width="96" height="8" rx="2"/><polygon points="96,30 214,30 238,42 238,64 152,64 96,52"/><polygon points="152,62 178,62 172,100 148,100"/><polygon points="214,40 254,46 250,76 224,66 214,62"/><rect x="104" y="22" width="44" height="8" rx="2"/>',
    sniper:'<rect x="2" y="46" width="112" height="6" rx="2"/><polygon points="108,40 230,40 244,50 244,66 108,62"/><polygon points="228,46 258,52 254,84 228,68"/><rect x="118" y="20" width="64" height="14" rx="6"/><rect x="132" y="34" width="6" height="8"/><rect x="164" y="34" width="6" height="8"/>',
    pistol:'<rect x="46" y="34" width="156" height="24" rx="5"/><polygon points="92,56 152,56 142,102 106,102"/><path d="M150 58 q22 4 22 18 l-14 0 q0 -8 -10 -8z"/>',
    knife:'<path d="M14 74 C62 6 176 6 222 44 L206 54 C170 34 96 38 54 86 Z"/><rect x="204" y="38" width="44" height="15" rx="7" transform="rotate(35 226 46)"/>',
    butterfly:'<polygon points="14,62 150,34 160,50 26,78"/><rect x="146" y="30" width="100" height="15" rx="7" transform="rotate(10 146 38)"/><rect x="146" y="54" width="100" height="15" rx="7" transform="rotate(-8 146 62)"/>',
    gloves:'<rect x="78" y="46" width="104" height="52" rx="14"/><rect x="80" y="14" width="17" height="46" rx="8"/><rect x="100" y="6" width="17" height="52" rx="8"/><rect x="120" y="8" width="17" height="50" rx="8"/><rect x="140" y="16" width="17" height="44" rx="8"/><rect x="158" y="50" width="50" height="17" rx="8" transform="rotate(-28 170 58)"/><rect x="72" y="90" width="116" height="14" rx="5"/>'
  }[t];
  const stops = cols.map((c, i) => `<stop offset="${i/(cols.length-1)}" stop-color="${c}"/>`).join("");
  const lines = Array.from({length:16}, (_, i) => `<line x1="${i*18-30}" y1="110" x2="${i*18+30}" y2="0"/>`).join("");
  const dots = Array.from({length:46}, (_, i) => `<circle cx="${(i*37)%260}" cy="${(i*53)%90+8}" r="${2+i%3}"/>`).join("");
  const ov = {
    stripe:`<g stroke="#fff" stroke-opacity=".3" stroke-width="3">${lines}</g>`,
    wave:`<g fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3"><path d="M0 36 Q40 6 80 36 T160 36 T240 36 T320 36"/><path d="M0 58 Q40 28 80 58 T160 58 T240 58 T320 58"/><path d="M0 80 Q40 50 80 80 T160 80 T240 80 T320 80"/></g>`,
    dots:`<g fill="#000" fill-opacity=".35">${dots}</g>`,
    flame:`<path d="M0 96 C30 40 56 90 92 36 S150 92 190 28 S246 84 270 36 L270 110 L0 110Z" fill="#000" fill-opacity=".32"/>`
  }[pat] || "";
  const det = t === "sniper" ? '<circle cx="150" cy="27" r="6" fill="#0ea5e9" stroke="#000"/>' : "";
  return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 112"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient><clipPath id="c">${P}</clipPath></defs><ellipse cx="130" cy="106" rx="98" ry="5" fill="#000" opacity=".35"/><g fill="url(#g)" stroke="#000" stroke-opacity=".65" stroke-width="2">${P}</g><g clip-path="url(#c)">${ov}</g>${det}</svg>`);
}
// ціни: середина діапазону з твого каталогу в UAH × 2 = коїни

  {name:"AK-47 | Redline",            val:2050,    img:art("rifle",["#dc2626","#7f1d1d","#1c1917"],"stripe")},
  {name:"Desert Eagle | Printstream", val:4500,    img:art("pistol",["#fafafa","#9ca3af","#374151"],"dots")},

const MINP = 0.01, MAXP = 0.95;
let uid = 1, sel = null, tgt = null, spinning = false, rot = 0, muted = false, tab = "my", balance = 10500, cases = 0, prize = null;

// ===== ЗВУК: по референсу — тихий хід, потім короткий "удар" на результаті, м'який тембр =====
let ac = null, master = null, echo = null, nb = null;
const AC = () => {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4500;
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
    echo = ac.createDelay(); echo.delayTime.value = 0.14;
    const fb = ac.createGain(); fb.gain.value = 0.28; const wet = ac.createGain(); wet.gain.value = 0.28;
    echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(lp);
    nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { last = (last + 0.04*(Math.random()*2 - 1)) / 1.04; d[i] = last*8; }   // "коричневий" шум, м'який
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
};
function bell(f, t0, d, v, useEcho){
  const c = AC();
  [[1, 1], [2.01, 0.2], [3.98, 0.05]].forEach(([m, a]) => {
    const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f*m;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v*a, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); if (useEcho) g.connect(echo); o.start(t0); o.stop(t0 + d + 0.05);
  });
}
function thud(t0, f0, f1, d, v){
  const c = AC(), o = c.createOscillator(), g = c.createGain(); o.type = "sine";
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + d*0.7);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.05);
}
function whoosh(t0, d, f0, f1, v){
  const c = AC(), s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = nb; s.loop = true; fl.type = "bandpass"; fl.Q.value = 0.8;
  fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + d*0.35); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(fl); fl.connect(g); g.connect(master); g.connect(echo); s.start(t0); s.stop(t0 + d + 0.05);
}
let tk = 0;
const sTick  = () => { if (!muted) bell((tk++ % 2) ? 520 : 440, AC().currentTime, 0.07, 0.05, false); };
const sStart = () => { if (!muted) { const t = AC().currentTime; whoosh(t, 1.4, 180, 1400, 0.5); thud(t, 110, 60, 0.25, 0.22); } };
const sWin   = () => { if (muted) return; const t = AC().currentTime;
  thud(t, 150, 45, 0.55, 0.55); whoosh(t, 0.8, 1800, 250, 0.45);
  [523.25, 659.25, 783.99, 1046.5].forEach(f => bell(f, t + 0.02, 1.1, 0.16, true));
  [2093, 2637, 3136].forEach((f, i) => bell(f, t + 0.12 + i*0.07, 0.5, 0.05, true)); };
const sLose  = () => { if (muted) return; const t = AC().currentTime; thud(t, 95, 36, 0.7, 0.5); bell(246.94, t + 0.04, 0.9, 0.16, true); bell(185, t + 0.25, 1.0, 0.14, true); };
const sSell  = () => { if (!muted) { const t = AC().currentTime; bell(1318, t, 0.25, 0.12, false); bell(1760, t + 0.07, 0.3, 0.1, false); } };

function rnd(){ const a = new Uint32Array(2); crypto.getRandomValues(a); return ((a[0]>>>5)*67108864 + (a[1]>>>6)) / 9007199254740992; }
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-US").replace(/,/g, " ");
const f1 = n => (Math.round(n*10)/10).toString();
const R = 112, CIRC = 2*Math.PI*R;
const near = v => CATALOG.reduce((b, s) => Math.abs(s.val - v) < Math.abs(b.val - v) ? s : b, CATALOG[0]);
const rc = v => v < 2000 ? "#4b69ff" : v < 10000 ? "#8847ff" : v < 60000 ? "#d32ce6" : v < 300000 ? "#eb4b4b" : "#e4ae39";
const im = (i, c) => i && i.img ? `<img src="${i.img}">` : `<div class="${c || 'em'}">🔫</div>`;

function calc(){
  const e = $("edge").value/100;
  if (!sel) { const p = $("chance").value/100; return {p, e, mult: (1-e)/p, target: 0}; }
  let p, target;
  if (tgt) { target = tgt.val; p = (1-e)*sel.val/target; if (p < MINP || p > MAXP) tgt = null; }
  if (!tgt) { p = $("chance").value/100; target = sel.val*(1-e)/p; }
  return {p, e, target, mult: target/sel.val};
}
function render(){
  const {p, e, mult, target} = calc();
  if (sel && tgt) $("chance").value = Math.min(95, Math.max(1, Math.round(p*100)));
  $("bal").textContent = fmt(balance);
  $("chLbl").textContent = f1(p*100); $("edgeLbl").textContent = $("edge").value;
  $("pct").textContent = f1(p*100).replace(".", ",") + "%";
  $("win").setAttribute("stroke-dasharray", `${CIRC*p} ${CIRC}`);
  const n = sel ? (tgt || near(target)) : null;
  $("myC").innerHTML = sel ? `<small>Мій предмет</small>${im(sel)}<b>${sel.name}</b><span class="pr">${fmt(sel.val)} C</span>` : `<small>Мій предмет</small><div class="em">⌃</div><b>Обери скін</b>`;
  $("tgC").innerHTML = sel ? `<small>Покращення · x${f1(mult)}</small>${tgt || target >= CATALOG[0].val/2 ? im(n) : '<div class="em">🔫</div>'}<b>${tgt ? tgt.name : "≈ " + n.name}</b><span class="pr">${fmt(target)} C</span>` : `<small>Покращення</small><div class="em">⌃</div><b>Обери ціль</b>`;
  document.querySelectorAll("#quick button").forEach(b => b.classList.toggle("on", !!b.dataset.c && !tgt && +b.dataset.c === Math.round(p*100)));
  $("go").disabled = !sel || spinning;
  $("tMy").classList.toggle("on", tab === "my"); $("tShop").classList.toggle("on", tab === "shop");
  if (tab === "my") {
    $("grid").innerHTML = inv.length ? inv.map(i => `<div class="gc ${sel&&sel.id===i.id?'sel':''}" style="--rc:${rc(i.val)}" data-id="${i.id}">${im(i)}<div class="nm">${i.name}</div><div class="p">${fmt(i.val)} C</div>${sel&&sel.id===i.id?'<button class="sell" data-sell="'+i.id+'">ПРОДАТИ</button>':''}</div>`).join("") : '<div class="note">Інвентар порожній — додай демо-предмет у параметрах</div>';
  } else {
    $("grid").innerHTML = CATALOG.map(s => { const q = sel ? (1-e)*sel.val/s.val : null, ok = q === null || (q >= MINP && q <= MAXP);
      return `<div class="gc ${ok?'':'dim'} ${tgt&&tgt.name===s.name?'sel':''}" style="--rc:${rc(s.val)}" data-n="${s.name}">${q!==null&&ok?'<span class="ch">'+f1(q*100)+'%</span>':''}${im(s)}<div class="nm">${s.name}</div><div class="p">${fmt(s.val)} C</div></div>`; }).join("");
  }
  $("math").textContent = sel ?
`Ставка:     ${fmt(sel.val)} C
Ціль:       ${tgt ? tgt.name : "вручну"} = ${fmt(target)} C
Шанс p:     (1 - e) × ставка / ціль = ${(p*100).toFixed(2)}%
Комісія e:  ${(e*100).toFixed(0)}% (шанс на екрані = реальний шанс)
Множник:    ціль / ставка = ${mult.toFixed(4)}x
Очікування: p × ціль = ${fmt(p*target)} C (${f1(p*target/sel.val*100)}% від ставки)` : "Обери свій предмет";
  updCase();
}
function setChance(pc){ tgt = null; $("chance").value = Math.min(95, Math.max(1, Math.round(pc))); render(); }
$("quick").onclick = ev => { const b = ev.target.closest("button"); if (!b || spinning) return;
  if (b.dataset.c) setChance(+b.dataset.c); else setChance((1 - $("edge").value/100)/(+b.dataset.m)*100); };
$("grid").onclick = ev => {
  if (spinning) return;
  const s = ev.target.closest("[data-sell]"); if (s) { const it = inv.find(i => i.id == s.dataset.sell); if (it) { sellItem(it); } return; }
  const d = ev.target.closest(".gc"); if (!d) return;
  if (d.dataset.id) { sel = inv.find(i => i.id == d.dataset.id); tgt = null; }
  else { const t = CATALOG.find(x => x.name === d.dataset.n); if (sel) { const q = (1-$("edge").value/100)*sel.val/t.val; if (q < MINP || q > MAXP) return; } tgt = t; }
  render();
};
$("tMy").onclick = () => { tab = "my"; render(); }; $("tShop").onclick = () => { tab = "shop"; render(); };
$("chance").oninput = () => { tgt = null; render(); }; $("edge").oninput = render;
$("add").onclick = () => { const a = parseFloat($("amt").value), k = parseFloat($("cur").value); if (a > 0) { inv.push(mk(Math.round(k ? a*k : a))); render(); } };
$("snd").onclick = e => { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; if (!muted) { AC(); sSell(); } };
function sellItem(it){ inv = inv.filter(i => i.id !== it.id); balance += it.val; if (sel && sel.id === it.id) { sel = null; tgt = null; } sSell(); render(); }

// ===== УТІШНИЙ КЕЙС (відкритий дроп 3–10 C, після програшу ставки від 100 C) =====
const JUNK = ["🏷️ Наклейка","🔑 Брелок","🎨 Спрей","🧢 Нашивка","📦 Уламок"];
function updCase(){ const t = `🎁 Утішний кейс (${cases}) · дроп 3–10 C`;
  $("caseBtn").style.display = cases > 0 && !spinning && !$("modal").classList.contains("on") ? "block" : "none"; $("caseBtn").textContent = t;
  $("mCase").style.display = cases > 0 && $("modal").dataset.lose === "1" ? "block" : "none"; $("mCase").textContent = t; }
function openCase(){
  if (cases < 1 || spinning) return; cases--; const n = 3 + Math.floor(rnd()*8);
  inv.push(mk(n, JUNK[Math.floor(rnd()*JUNK.length)])); if (!muted) { AC(); bell(880, ac.currentTime, 0.5, 0.14, true); }
  $("res").style.color = "var(--y)"; $("res").textContent = `Утішний кейс: +${n} C`; $("mSub").textContent = `Утішний кейс: +${n} C`; render();
}
$("caseBtn").onclick = openCase; $("mCase").onclick = openCase;

function showModal(win, stake, pz){
  const m = $("modal"); m.dataset.lose = win ? "0" : "1";
  $("mh").className = "mh " + (win ? "w" : "l"); $("mh").textContent = win ? "ПЕРЕМОГА!" : "ПРОГРАШ";
  $("mSub").textContent = win ? "Ви отримали" : "Ви втратили";
  const it = win ? pz : stake; $("mImg").innerHTML = im(it);
  $("mName").textContent = it.name; $("mPrice").textContent = fmt(it.val) + " C";
  $("mSell").style.display = win ? "block" : "none"; $("mSell").onclick = () => { sellItem(pz); m.classList.remove("on"); updCase(); };
  $("mCont").onclick = () => { m.classList.remove("on"); updCase(); };
  m.classList.add("on"); updCase();
}

$("go").onclick = () => {
  if (!sel || spinning) return;
  spinning = true; $("go").disabled = true; $("res").textContent = ""; AC(); sStart(); updCase();
  const {p, mult, target} = calc(), r = rnd(), win = r < p, stake = sel, tgt0 = tgt;
  const start = rot, end = rot + 360*6 + (((r*360 - start%360) % 360) + 360) % 360, dur = 5200, t0 = performance.now();
  let lastTick = Math.floor(start/24), lastT = 0; const ptr = $("ptr");
  (function step(now){
    const t = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - t, 4), a = start + (end - start)*e;
    ptr.style.transform = `rotate(${a}deg)`;
    const k = Math.floor(a/24); if (k !== lastTick) { lastTick = k; if (now - lastT > 110) { lastT = now; sTick(); } }
    if (t < 1) return requestAnimationFrame(step);
    rot = end; finish();
  })(t0);
  function finish(){
    inv = inv.filter(i => i.id !== stake.id); let pz = null;
    if (win) { const n = tgt0 || near(target); pz = mk(Math.round(target), tgt0 ? tgt0.name : "Upgrade x" + mult.toFixed(2), n.img); inv.push(pz); sWin(); }
    else { sLose(); if (stake.val >= 100) cases++; }
    sel = null; tgt = null; spinning = false; render(); showModal(win, stake, pz);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? "success" : "error");
  }
};
render();
</script>
